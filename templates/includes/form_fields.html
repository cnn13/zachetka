{% for error in form.non_field_errors %}<p class="alert alert-danger">{{ error }}</p>{% endfor %}
{% for field in form %}<div class="mb-3">
<label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
{{ field }}{% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}
{% for error in field.errors %}<p class="text-danger">{{ error }}</p>{% endfor %}</div>{% endfor %}
