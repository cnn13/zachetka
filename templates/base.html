{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Зачётка{% endblock %} · Зачётка</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Manrope', system-ui, sans-serif;
            background: #F3F6E8;
            color: #26331A;
            line-height: 1.5;
        }

        a {
            color: #3F5A2A;
        }

        h1, h2, h3, p {
            margin: 0;
        }

        .serif {
            font-family: 'Manrope', system-ui, sans-serif;
        }

        .nav {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0 32px;
            padding: 8px 40px;
            border-bottom: 1px solid #C9D6A9;
            font-size: 12px;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

            .nav a {
                color: #26331A;
                text-decoration: none;
                min-height: 44px;
                display: inline-flex;
                align-items: center;
            }

                .nav a.brand {
                    margin-right: auto;
                    font-size: 22px;
                    font-weight: 700;
                    text-transform: none;
                    letter-spacing: 0;
                    color: #3F5A2A;
                }

        .wrap {
            max-width: 1180px;
            margin: 0 auto;
            padding: 56px 40px 96px;
            display: flex;
            flex-direction: column;
            gap: 56px;
        }

        .lbl {
            font-size: 12px;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: #5F7345;
        }

        .muted {
            color: #5F7345;
        }

        .mark {
            display: inline-block;
            width: fit-content;
            background: #F6C3B2;
            color: #26331A;
            padding: 2px 8px;
            font-size: 12px;
            letter-spacing: .06em;
            text-transform: uppercase;
            font-weight: 600;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 24px;
            background: #3F5A2A;
            color: #F3F6E8;
            font: inherit;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: .1em;
            text-transform: uppercase;
            text-decoration: none;
            border: 1px solid #3F5A2A;
            cursor: pointer;
        }

            .btn.ghost {
                background: transparent;
                color: #26331A;
                border-color: #3F5A2A;
            }

        .st {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            padding: 0 16px;
            border: 1px solid #9CB07A;
            color: #26331A;
            text-decoration: none;
            font-size: 14px;
        }

            .st + .st {
                margin-left: -1px;
            }

            .st.on {
                background: #3F5A2A;
                color: #F3F6E8;
                border-color: #3F5A2A;
            }

        select, textarea {
            min-height: 44px;
            border: 0;
            border-bottom: 1px solid #9CB07A;
            border-radius: 0;
            background: transparent;
            color: #26331A;
            font: inherit;
            width: 100%;
            box-sizing: border-box;
            padding: 0;
        }

        textarea {
            border: 1px solid #9CB07A;
            padding: 12px;
        }

        select option {
            background: #F3F6E8;
        }

        label {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 32px;
            padding: 24px 0;
            border-top: 1px solid #C9D6A9;
            text-decoration: none;
            color: #26331A;
        }

            .row.last {
                border-bottom: 1px solid #C9D6A9;
            }

            .row .ttl {
                flex: 1 1 300px;
            }

        a.row:hover .ttl {
            color: #3F5A2A;
        }

        .grid4 {
            display: grid;
            gap: 24px;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        }

        .top {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            justify-content: space-between;
            align-items: flex-end;
        }

        .h1 {
            font-family: 'Manrope', system-ui, sans-serif;
            letter-spacing: -.02em;
            font-weight: 800;
            font-size: clamp(32px, 4.5vw, 52px);
            line-height: .95;
            color: #3F5A2A;
        }

        .foot {
            border-top: 1px solid #C9D6A9;
            padding: 24px 40px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0 32px;
            font-size: 13px;
            color: #5F7345;
            margin-top: auto;
        }

            .foot a {
                color: #26331A;
                text-decoration: none;
                min-height: 44px;
                display: inline-flex;
                align-items: center;
            }

                .foot a.brand {
                    margin-right: auto;
                    font-weight: 800;
                    font-size: 18px;
                    color: #3F5A2A;
                }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="nav" aria-label="Главное меню">
        <a class="brand" href="{% url 'home' %}">Зачётка</a>
        <a href="{% url 'materials:index' %}">Архив</a>
        <a href="{% url 'tickets:index' %}">Билеты</a>
        <a href="{% url 'timer:index' %}">Таймер</a>
        <a href="{% url 'accounts:index' %}">Профиль</a>
    </nav>

    {% block content %}{% endblock %}

    <footer class="foot">
        <a class="brand" href="{% url 'home' %}">Зачётка</a>
        <a href="{% url 'materials:index' %}">Архив</a>
        <a href="{% url 'tickets:index' %}">Билеты</a>
        <a href="{% url 'timer:index' %}">Таймер</a>
        <a href="{% url 'accounts:index' %}">Профиль</a>
        <span class="muted" style="margin-left: auto;">&copy; 2026 Зачётка</span>
    </footer>

    <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
