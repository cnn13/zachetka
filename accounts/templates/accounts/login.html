{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="wrap"><div class="form-panel"><h1 class="h1">Вход</h1>
<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}">{% include "includes/form_fields.html" %}<button class="btn" type="submit">Войти</button></form>
<p style="margin-top:16px">Нет аккаунта? <a href="{% url 'accounts:register' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Зарегистрироваться</a></p>
</div></div>
{% endblock %}
